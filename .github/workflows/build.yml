name: build

on:
  push:
    branches: [ main, dev, use-ccache ]
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

env:
  CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
        buildType: [ Release, Debug ]

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.3
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache
          max-size: 2000M
          verbose: 2

      - name: Configure ccache
        if: runner.os != 'macOS'
        run: |
          ccache --set-config=cache_dir=${{ github.workspace }}/.ccache
          ccache --zero-stats

      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install libasound2-dev libxinerama-dev libx11-dev libxext-dev libfreetype-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev xvfb ninja-build

      - name: configure
        run: cmake . --preset ci

      - name: build
        run: cmake --build --preset ci

      - name: pluginval
        run: cmake --build --preset ci --target pluginval_Eq

      - name: auval
        if: runner.os == 'macOS'
        run: cmake --build --preset ci --target auval_Eq
